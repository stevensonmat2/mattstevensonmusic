{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Matt Stevenson Music{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    {% block extra_head %}{% endblock %}
</head>

<body>
    <header class="site-header">
        <a class="site-banner" href="{% url 'pages:home' %}" aria-label="Matt Stevenson home"></a>
    </header>

    <nav class="navbar navbar-expand-md sticky-top" aria-label="Primary navigation">
        <div class="container-xl justify-content-center">
            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                data-bs-target="#primary-navigation" aria-controls="primary-navigation" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="primary-navigation">
                <div class="navbar-nav">
                    <a class="nav-link" href="{% url 'pages:home' %}">Latest</a>
                    <a class="nav-link" href="{% url 'pages:about' %}">About</a>
                    <a class="nav-link" href="{% url 'pages:contact' %}">Contact</a>
                </div>
                <form class="d-flex gap-2 mt-3 mt-md-0" action="{% url 'pages:home' %}" method="get" role="search">
                    <label class="visually-hidden" for="post-search">Search posts</label>
                    <input class="form-control" id="post-search" name="q" type="search" value="{{ search_query }}"
                        placeholder="Search posts" autocomplete="off">
                    <button class="btn btn-dark text-nowrap" type="submit">Search</button>
                    {% if tag_slug %}<input type="hidden" name="tag" value="{{ tag_slug }}">{% endif %}
                </form>
            </div>
        </div>
    </nav>

    <main class="container-xl py-5 pb-5">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
